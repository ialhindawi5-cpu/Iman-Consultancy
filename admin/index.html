<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — Iman Hindawi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e2438'/%3E%3Ctext x='32' y='43' font-family='Segoe UI,Arial,sans-serif' font-size='27' font-weight='600' fill='%23ffffff' text-anchor='middle'%3EIH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="admin.css">
</head>
<body class="booting">

<!-- ───────────── Sign in ───────────── -->
<div class="auth" id="authScreen" hidden>
  <div class="auth-card">
    <div class="auth-mark" aria-hidden="true">IH</div>

    <form id="loginForm" class="auth-form">
      <h1>Dashboard</h1>
      <p class="auth-sub">Sign in to edit your website.</p>
      <label for="li-email">Email</label>
      <input id="li-email" name="email" type="email" autocomplete="username" required>
      <label for="li-password">Password</label>
      <input id="li-password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary btn-block" type="submit">Continue</button>
      <button class="linkish" type="button" id="forgotBtn">Forgotten your password?</button>
      <p class="auth-msg" id="loginMsg" role="alert"></p>
    </form>

    <form id="codeForm" class="auth-form" hidden>
      <h1>Check your email</h1>
      <p class="auth-sub" id="codeSub">We sent a 6-digit code.</p>
      <label for="li-code">Verification code</label>
      <input id="li-code" name="code" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" pattern="[0-9]{6}" required>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      <button class="linkish" type="button" id="resendBtn">Send a new code</button>
      <button class="linkish" type="button" id="backToLogin">Start again</button>
      <p class="auth-msg" id="codeMsg" role="alert"></p>
    </form>

    <form id="resetForm" class="auth-form" hidden>
      <h1>Reset password</h1>
      <p class="auth-sub">We'll email you a code, then you can choose a new password.</p>
      <label for="rs-email">Email</label>
      <input id="rs-email" name="email" type="email" autocomplete="username" required>
      <label for="rs-code">Code from the email</label>
      <input id="rs-code" name="code" inputmode="numeric" maxlength="6">
      <label for="rs-password">New password</label>
      <input id="rs-password" name="password" type="password" autocomplete="new-password"
             minlength="10" placeholder="At least 10 characters">
      <button class="btn btn-ghost btn-block" type="button" id="sendResetBtn">Email me a code</button>
      <button class="btn btn-primary btn-block" type="submit">Set new password</button>
      <button class="linkish" type="button" id="backToLogin2">Back to sign in</button>
      <p class="auth-msg" id="resetMsg" role="alert"></p>
    </form>
  </div>
</div>

<!-- ───────────── Dashboard ───────────── -->
<div class="app" id="app" hidden>
  <button class="drawer-toggle" id="drawerToggle" aria-expanded="false" aria-controls="sidebar"
          aria-label="Open menu"><span></span><span></span><span></span></button>

  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <span class="side-mark" aria-hidden="true">IH</span>
      <div>
        <p class="side-name">Iman Hindawi</p>
        <p class="side-role">Dashboard</p>
      </div>
    </div>

    <nav class="side-nav" id="sideNav" aria-label="Sections"></nav>

    <div class="side-foot">
      <button class="btn btn-primary btn-block" id="saveAllBtn" type="button">Save all changes</button>
      <a class="side-link" id="previewLink" href="/?preview=1" target="_blank" rel="noopener">Preview draft ↗</a>
      <a class="side-link" href="/" target="_blank" rel="noopener">View live site ↗</a>
      <p class="side-user" id="sideUser"></p>
      <button class="linkish" id="logoutBtn" type="button">Sign out</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="panels" id="panels"></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- Version history -->
<div class="modal" id="historyModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <header class="modal-head">
      <h2 id="historyTitle">History</h2>
      <button class="modal-close" id="historyClose" type="button" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body" id="historyBody"></div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
